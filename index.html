<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ البطاقات البنكية بذكاء Gemini الاصطناعي</title>
    <!-- استيراد Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <!-- عنوان الصفحة -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">ماسح البطاقات البنكية بـ Gemini AI</h1>
            <p class="text-sm text-slate-400 mt-1">التقاط أو رفع وجهي البطاقة للتحليل التلقائي</p>
        </div>

        <!-- خطوات التصوير أو الرفع -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <!-- وجه البطاقة -->
            <div class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center bg-slate-900/50">
                <h3 class="font-semibold text-sm mb-2 text-blue-300">1. وجه البطاقة (الأمامي)</h3>
                <input type="file" id="front-input" accept="image/*" capture="environment" class="hidden" onchange="handleImage(event, 'front')">
                <label for="front-input" class="cursor-pointer inline-block bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 px-4 rounded-lg transition">
                    اختر صورة أو التقط الوجه
                </label>
                <div id="front-preview" class="mt-3 text-xs text-slate-400">لم يتم اختيار صورة</div>
            </div>

            <!-- ظهر البطاقة -->
            <div class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center bg-slate-900/50">
                <h3 class="font-semibold text-sm mb-2 text-purple-300">2. ظهر البطاقة (الخلفي)</h3>
                <input type="file" id="back-input" accept="image/*" capture="environment" class="hidden" onchange="handleImage(event, 'back')">
                <label for="back-input" class="cursor-pointer inline-block bg-purple-600 hover:bg-purple-700 text-white text-xs font-medium py-2 px-4 rounded-lg transition">
                    اختر صورة أو التقط الظهر
                </label>
                <div id="back-preview" class="mt-3 text-xs text-slate-400">لم يتم اختيار صورة</div>
            </div>
        </div>

        <!-- زر التحليل التلقائي بالذكاء الاصطناعي -->
        <button onclick="processCardWithGemini()" id="process-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition mb-6 flex items-center justify-center gap-2">
            <span>✨ تحليل البطاقة تلقائياً بذكاء Gemini</span>
        </button>

        <!-- حالة التحميل -->
        <div id="loading" class="hidden text-center py-4 text-yellow-400 text-sm animate-pulse">
            جاري إرسال الصور وتحليلها بواسطة Gemini AI، يرجى الانتظار...
        </div>

        <!-- حقول النتائج المستخرجة (تظهر تحت) -->
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-3 mb-6">
            <h3 class="text-sm font-bold text-slate-300 border-b border-slate-800 pb-2">البيانات المستخرجة تلقائياً:</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">رقم البطاقة:</label>
                <input type="text" id="card-number" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 font-mono" placeholder="سيظهر رقم البطاقة هنا...">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">تاريخ الانتهاء:</label>
                    <input type="text" id="card-expiry" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 font-mono" placeholder="MM/YY">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">رمز الأمان (CVV):</label>
                    <input type="text" id="card-cvv" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-sm text-emerald-400 font-mono" placeholder="CVV">
                </div>
            </div>
        </div>

        <!-- أزرار الحفظ والإدارة -->
        <div class="flex gap-3">
            <button onclick="saveCard()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
                💾 حفظ البطاقة محلياً
            </button>
            <button onclick="loadSavedCards()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium py-2.5 px-4 rounded-xl transition text-sm">
                📂 البطاقات المحفوظة
            </button>
        </div>

        <!-- قائمة البطاقات المحفوظة -->
        <div id="saved-cards-container" class="mt-6 hidden">
            <h3 class="text-sm font-bold text-slate-300 mb-2">البطاقات المخزنة في المتصفح:</h3>
            <div id="saved-cards-list" class="space-y-2 max-h-40 overflow-y-auto text-xs"></div>
        </div>
    </div>

    <script>
        // مفتاح Gemini API المدمج
        const GEMINI_API_KEY = "AQ.Ab8RN6LiWhZ82I1A94VuOlNsLN7Yz1QL7GRBLVBH60n7gUnkOA";
        
        let frontImageFile = null;
        let backImageFile = null;

        function handleImage(event, type) {
            const file = event.target.files[0];
            if (file) {
                if (type === 'front') {
                    frontImageFile = file;
                    document.getElementById('front-preview').innerHTML = `<span class="text-emerald-400">تم رفع الوجه: ${file.name}</span>`;
                } else {
                    backImageFile = file;
                    document.getElementById('back-preview').innerHTML = `<span class="text-emerald-400">تم رفع الظهر: ${file.name}</span>`;
                }
            }
        }

        async function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function processCardWithGemini() {
            if (!frontImageFile && !backImageFile) {
                alert('يرجى اختيار صورة واحدة على الأقل (الوجه أو الظهر) للتحليل.');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');

            try {
                let parts = [
                    { 
                        text: "قم بتحليل صور البطاقة البنكية المرفقة (سواء الوجه الأمامي أو الظهر أو كلاهما) واستخرج المعلومات بدقة بصيغة JSON فقط، بحيث يحتوي على المفاتيح التالية بالبطاقة: cardNumber (رقم البطاقة مكون من أرقام متصلة بدون مسافات)، expiryDate (تاريخ الانتهاء بصيغة MM/YY)، cvv (رمز الأمان المكون من 3 أو 4 أرقام من ظهر البطاقة إن وجد). لا تضف أي نصوص إضافية خارج صيغة JSON." 
                    }
                ];

                if (frontImageFile) {
                    const frontBase64 = await convertFileToBase64(frontImageFile);
                    parts.push({
                        inline_data: {
                            mime_type: frontImageFile.type,
                            data: frontBase64.split(',')[1]
                        }
                    });
                }

                if (backImageFile) {
                    const backBase64 = await convertFileToBase64(backImageFile);
                    parts.push({
                        inline_data: {
                            mime_type: backImageFile.type,
                            data: backBase64.split(',')[1]
                        }
                    });
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                document.getElementById('loading').classList.add('hidden');

                if (data.candidates && data.candidates[0].content) {
                    const rawText = data.candidates[0].content.parts[0].text;
                    const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const cardData = JSON.parse(cleanJson);

                    // تعبئة الحقول تلقائياً
                    if (cardData.cardNumber) document.getElementById('card-number').value = cardData.cardNumber;
                    if (cardData.expiryDate) document.getElementById('card-expiry').value = cardData.expiryDate;
                    if (cardData.cvv) document.getElementById('card-cvv').value = cardData.cvv;

                    alert('تم استخراج بيانات البطاقة بنجاح بواسطة Gemini!');
                } else {
                    alert('عذراً، لم يتمكن النموذج من قراءة البطاقة بوضوح. تأكد من وضوح الصورة.');
                }

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بخدمة Gemini AI.');
            }
        }

        function saveCard() {
            const number = document.getElementById('card-number').value;
            const expiry = document.getElementById('card-expiry').value;
            const cvv = document.getElementById('card-cvv').value;

            if (!number) {
                alert('لا توجد بيانات لحفظها!');
                return;
            }

            const cardData = { number, expiry, cvv, date: new Date().toLocaleString() };
            let savedCards = JSON.parse(localStorage.getItem('saved_bank_cards') || '[]');
            savedCards.push(cardData);
            localStorage.setItem('saved_bank_cards', JSON.stringify(savedCards));

            alert('تم حفظ البطاقة بنجاح في ذاكرة المتصفح المحلية!');
            loadSavedCards();
        }

        function loadSavedCards() {
            const container = document.getElementById('saved-cards-container');
            const list = document.getElementById('saved-cards-list');
            let savedCards = JSON.parse(localStorage.getItem('saved_bank_cards') || '[]');

            container.classList.remove('hidden');
            list.innerHTML = '';

            if (savedCards.length === 0) {
                list.innerHTML = '<div class="text-slate-500">لا توجد بطاقات محفوظة بعد.</div>';
                return;
            }

            savedCards.forEach((card, index) => {
                const maskedNum = card.number ? card.number.replace(/\d{8}(?=\d{4})/, '**** **** ') : 'رقم غير متوفر';
                const div = document.createElement('div');
                div.className = "bg-slate-800 p-2.5 rounded-lg border border-slate-700 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <span class="text-emerald-400 font-mono font-bold">${maskedNum}</span>
                        <div class="text-slate-400 text-[10px]">الانتهاء: ${card.expiry || 'N/A'} | CVV: ${card.cvv || 'N/A'}</div>
                    </div>
                    <button onclick="deleteCard(${index})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1 bg-red-950/40 rounded">حذف</button>
                `;
                list.appendChild(div);
            });
        }

        function deleteCard(index) {
            let savedCards = JSON.parse(localStorage.getItem('saved_bank_cards') || '[]');
            savedCards.splice(index, 1);
            localStorage.setItem('saved_bank_cards', JSON.stringify(savedCards));
            loadSavedCards();
        }
    </script>
</body>
</html>
