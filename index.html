<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قارئ NFC عبر الويب</title>
    <!-- استيراد خط وتنسيقات Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
        <!-- رأس الصفحة -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-3 shadow-inner">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">قارئ بطاقات NFC</h1>
            <p class="text-sm text-gray-500 mt-1">امسح بطاقة أو ملصق NFC لعرض البيانات</p>
        </div>

        <!-- حالة الدعم والاتصال -->
        <div id="status" class="mb-6 p-4 rounded-xl bg-yellow-50 border border-yellow-200 text-yellow-800 text-sm flex items-center gap-3">
            <span class="w-3 h-3 bg-yellow-500 rounded-full inline-block flex-shrink-0"></span>
            <span id="status-text">جاري التحقق من دعم المتصفح لـ NFC...</span>
        </div>

        <!-- أزرار التحكم -->
        <div class="space-y-3 mb-6">
            <button id="scan-btn" onclick="startNfcScan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                بدء المسح (Scan)
            </button>
            <button id="clear-btn" onclick="clearLog()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-xl transition duration-200 text-sm">
                مسح السجل
            </button>
        </div>

        <!-- منطقة عرض النتائج -->
        <div>
            <h2 class="text-sm font-semibold text-gray-700 mb-2">البيانات المستلمة:</h2>
            <div id="output" class="bg-gray-900 text-green-400 font-mono text-xs p-4 rounded-xl h-48 overflow-y-auto border border-gray-800 space-y-2">
                <div class="text-gray-500">جاهز للمسح...</div>
            </div>
        </div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        const outputEl = document.getElementById('output');
        const scanBtn = document.getElementById('scan-btn');

        // التحقق من توفر ميزة Web NFC في المتصفح
        if ('NDEFReader' in window) {
            statusEl.className = "mb-6 p-4 rounded-xl bg-blue-50 border border-blue-200 text-blue-800 text-sm flex items-center gap-3";
            statusText.innerHTML = "متصفحك يدعم تقنية NFC. انقر على زر ابدأ المسح.";
        } else {
            statusEl.className = "mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm flex items-center gap-3";
            statusText.innerHTML = "عذراً، متصفحك الحالي لا يدعم Web NFC (موصى باستخدام Google Chrome على Android).";
            scanBtn.disabled = true;
            scanBtn.classList.add('opacity-50', 'cursor-not-allowed');
        }

        async function startNfcScan() {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                
                statusEl.className = "mb-6 p-4 rounded-xl bg-green-50 border border-green-200 text-green-800 text-sm flex items-center gap-3";
                statusText.innerHTML = "تم تفعيل المسح بنجاح! قرب بطاقة NFC من جهازك الآن...";
                appendLog("✨ تم تنشيط القارئ، بانتظار البطاقة...", "text-blue-400");

                ndef.onreading = event => {
                    const { serialNumber, message } = event;
                    appendLog(`📌 رقم البطاقة التسلسلي (UID): ${serialNumber || 'غير متوفر'}`, "text-yellow-400");

                    for (const record of message.records) {
                        switch (record.recordType) {
                            case "text":
                                const textDecoder = new TextDecoder(record.encoding);
                                const text = textDecoder.decode(record.data);
                                appendLog(`📄 نوع السجل: نص (Text)\nمحتوى النص: ${text}`, "text-green-300");
                                break;
                            case "url":
                                const urlDecoder = new TextDecoder();
                                const url = urlDecoder.decode(record.data);
                                appendLog(`🌐 نوع السجل: رابط (URL)\nالرابط: ${url}`, "text-blue-300");
                                break;
                            default:
                                appendLog(`📦 سجل من نوع غير معروف: ${record.recordType}`, "text-gray-300");
                        }
                    }
                };

                ndef.onreadingerror = () => {
                    appendLog("⚠️ حدث خطأ أثناء محاولة قراءة البطاقة، جرب مرة أخرى.", "text-red-400");
                };

            } catch (error) {
                console.error(error);
                statusEl.className = "mb-6 p-4 rounded-xl bg-red-50 border border-red-200 text-red-800 text-sm flex items-center gap-3";
                statusText.innerHTML = `خطأ: ${error.message}`;
                appendLog(`❌ خطأ في التشغيل: ${error.message}`, "text-red-400");
            }
        }

        function appendLog(message, colorClass = "text-green-400") {
            // إزالة رسالة "جاهز للمسح" عند ورود أول سجل
            if (outputEl.querySelector('.text-gray-500')) {
                outputEl.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = `${colorClass} whitespace-pre-wrap border-b border-gray-800 pb-2 mb-2`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            outputEl.appendChild(div);
            outputEl.scrollTop = outputEl.scrollHeight;
        }

        function clearLog() {
            outputEl.innerHTML = '<div class="text-gray-500">جاهز للمسح...</div>';
        }
    </script>
</body>
</html>
