<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح البطاقات التلقائي بالذكاء الاصطناعي</title>
    <!-- استيراد Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استيراد حزمة Google Generative AI للويب -->
    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
        <!-- العنوان -->
        <div class="text-center mb-4">
            <h1 class="text-xl font-bold text-blue-400">ماسح البطاقات التلقائي</h1>
            <p id="instruction-text" class="text-xs text-yellow-400 mt-1 font-semibold">ثبت [وجه البطاقة الأمامي] داخل الإطار...</p>
        </div>

        <!-- معاينة الكاميرا المباشرة -->
        <div class="relative w-full h-56 bg-black rounded-xl overflow-hidden border-2 border-slate-600 mb-4 shadow-inner">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- إطار التوجيه -->
            <div id="scan-frame" class="absolute inset-4 border-2 border-dashed border-yellow-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-yellow-200 bg-black/10 transition-all duration-300">
                جاري الانتظار لالتقاط الصورة تلقائياً...
            </div>
        </div>

        <!-- مؤشر الحالة -->
        <div id="loading" class="hidden text-center py-2 text-cyan-400 text-xs animate-pulse mb-3 font-bold">
            ✨ يتم تحليل الصورة بذكاء Gemini الاصطناعي...
        </div>

        <!-- حقول النتائج المستخرجة -->
        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2.5 mb-4">
            <h3 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-1.5">البيانات المستخرجة:</h3>
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">رقم البطاقة:</label>
                <input type="text" id="card-number" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="رقم البطاقة...">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">تاريخ الانتهاء:</label>
                    <input type="text" id="card-expiry" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="MM/YY">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">رمز الأمان (CVV):</label>
                    <input type="text" id="card-cvv" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="CVV">
                </div>
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="flex gap-2">
            <button onclick="resetScanner()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 px-3 rounded-xl transition text-xs">
                إعادة ضبط
            </button>
            <button onclick="saveCard()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-xl transition text-xs">
                💾 حفظ البطاقة محلياً
            </button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "@google/genai";

        const ai = new GoogleGenAI({ apiKey: "AQ.Ab8RN6LiWhZ82I1A94VuOlNsLN7Yz1QL7GRBLVBH60n7gUnkOA" });
        
        let currentStep = 'front'; 
        let videoStream = null;
        let isProcessing = false;
        let autoCaptureTimer = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const instructionText = document.getElementById('instruction-text');
        const scanFrame = document.getElementById('scan-frame');
        const loadingEl = document.getElementById('loading');

        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = videoStream;
                
                video.onloadedmetadata = () => {
                    startAutoCaptureLoop();
                };
            } catch (err) {
                console.error("خطأ في تشغيل الكاميرا: ", err);
                alert("تعذر الوصول إلى كاميرا الجهاز. تأكد من إعطاء الصلاحيات.");
            }
        }

        initCamera();

        function startAutoCaptureLoop() {
            autoCaptureTimer = setInterval(() => {
                if (!isProcessing && currentStep !== 'done') {
                    autoCaptureAndProcess();
                }
            }, 4000);
        }

        async function autoCaptureAndProcess() {
            isProcessing = true;
            loadingEl.classList.remove('hidden');
            scanFrame.className = "absolute inset-4 border-2 border-solid border-cyan-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-cyan-200 bg-cyan-950/30 transition-all duration-300";

            const maxWidth = 800;
            const scale = maxWidth / video.videoWidth;
            canvas.width = maxWidth;
            canvas.height = (video.videoHeight || 600) * scale;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.85);
            const pureBase64 = base64Image.split(',')[1];

            try {
                let prompt = "";
                if (currentStep === 'front') {
                    prompt = "Analyze this bank card front image. Extract the card number and the expiry date (MM/YY). Return ONLY a raw JSON object with keys: cardNumber and expiryDate. Example: {\"cardNumber\": \"1234567890123456\", \"expiryDate\": \"10/24\"}. Do not wrap in markdown.";
                } else {
                    prompt = "Analyze this bank card back image. Extract the CVV or CVC security code. Return ONLY a raw JSON object with key: cvv. Example: {\"cvv\": \"123\"}. Do not wrap in markdown.";
                }

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: [
                        { text: prompt },
                        {
                            inlineData: {
                                mimeType: "image/jpeg",
                                data: pureBase64
                            }
                        }
                    ]
                });

                loadingEl.classList.add('hidden');
                let rawText = response.text ? response.text.trim() : "";
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                const parsedData = JSON.parse(rawText);

                if (currentStep === 'front') {
                    if (parsedData.cardNumber && parsedData.cardNumber.length >= 12) {
                        document.getElementById('card-number').value = parsedData.cardNumber;
                        if (parsedData.expiryDate) document.getElementById('card-expiry').value = parsedData.expiryDate;

                        currentStep = 'back';
                        instructionText.textContent = "ممتاز! الآن اقلب البطاقة لالتقاط الظهر (CVV) تلقائياً...";
                        instructionText.className = "text-xs text-purple-400 mt-1 font-semibold";
                        scanFrame.className = "absolute inset-4 border-2 border-dashed border-purple-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-purple-200 bg-black/10 transition-all duration-300";
                    }
                } else {
                    if (parsedData.cvv && parsedData.cvv.length >= 3) {
                        document.getElementById('card-cvv').value = parsedData.cvv;
                        currentStep = 'done';
                        clearInterval(autoCaptureTimer);
                        instructionText.textContent = "تمت قراءة البطاقة واكتمال البيانات بنجاح! 🎉";
                        instructionText.className = "text-xs text-emerald-400 mt-1 font-semibold";
                        scanFrame.className = "absolute inset-4 border-2 border-solid border-emerald-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-emerald-200 bg-emerald-950/30 transition-all duration-300";
                    }
                }
            } catch (error) {
                console.error(error);
                loadingEl.classList.add('hidden');
            }

            if (currentStep !== 'done') {
                isProcessing = false;
                if (currentStep === 'front') {
                    scanFrame.className = "absolute inset-4 border-2 border-dashed border-yellow-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-yellow-200 bg-black/10 transition-all duration-300";
                } else {
                    scanFrame.className = "absolute inset-4 border-2 border-dashed border-purple-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-purple-200 bg-black/10 transition-all duration-300";
                }
            }
        }

        window.resetScanner = function() {
            currentStep = 'front';
            isProcessing = false;
            document.getElementById('card-number').value = '';
            document.getElementById('card-expiry').value = '';
            document.getElementById('card-cvv').value = '';
            instructionText.textContent = "ثبت [وجه البطاقة الأمامي] داخل الإطار...";
            instructionText.className = "text-xs text-yellow-400 mt-1 font-semibold";
            scanFrame.className = "absolute inset-4 border-2 border-dashed border-yellow-400 rounded-lg pointer-events-none flex items-center justify-center text-xs text-yellow-200 bg-black/10 transition-all duration-300";
            
            clearInterval(autoCaptureTimer);
            startAutoCaptureLoop();
        };

        window.saveCard = function() {
            const number = document.getElementById('card-number').value;
            const expiry = document.getElementById('card-expiry').value;
            const cvv = document.getElementById('card-cvv').value;

            if (!number) {
                alert('لا توجد بيانات كافية لحفظها!');
                return;
            }

            const cardData = { number, expiry, cvv, date: new Date().toLocaleString() };
            let savedCards = JSON.parse(localStorage.getItem('saved_bank_cards') || '[]');
            savedCards.push(cardData);
            localStorage.setItem('saved_bank_cards', JSON.stringify(savedCards));

            alert('تم حفظ البطاقة بنجاح في متصفحك!');
        };
    </script>
</body>
</html>
