<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماسح البطاقات البنكية التفاعلي بـ Gemini AI</title>
    <!-- استيراد Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl p-5 border border-slate-700">
        <!-- العنوان -->
        <div class="text-center mb-4">
            <h1 class="text-xl font-bold text-blue-400">ماسح البطاقات التفاعلي</h1>
            <p id="instruction-text" class="text-xs text-yellow-400 mt-1 font-semibold">الخطوة 1: يرجى توجيه الكاميرا نحو [وجه البطاقة الأمامي]</p>
        </div>

        <!-- معاينة الكاميرا المباشرة -->
        <div class="relative w-full h-56 bg-black rounded-xl overflow-hidden border-2 border-slate-600 mb-4 shadow-inner">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            
            <!-- إطار إرشادي للبطاقة -->
            <div class="absolute inset-4 border-2 border-dashed border-blue-400/60 rounded-lg pointer-events-none flex items-center justify-center">
                ضع البطاقة داخل الإطار
            </div>
        </div>

        <!-- أزرار التحكم -->
        <div class="flex gap-2 mb-4">
            <button onclick="captureCardSide()" id="capture-btn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm shadow-md">
                📸 التقاط وجه البطاقة
            </button>
            <button onclick="resetScanner()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 px-3 rounded-xl transition text-xs">
                إعادة ضبط
            </button>
        </div>

        <!-- حالة التحميل -->
        <div id="loading" class="hidden text-center py-2 text-cyan-400 text-xs animate-pulse mb-3">
            جاري تحليل الصورة بالذكاء الاصطناعي، يرجى الانتظار...
        </div>

        <!-- حقول النتائج المستخرجة (تظهر تحت) -->
        <div class="bg-slate-900 p-3.5 rounded-xl border border-slate-700 space-y-2.5 mb-4">
            <h3 class="text-xs font-bold text-slate-300 border-b border-slate-800 pb-1.5">البيانات المستخرجة:</h3>
            <div>
                <label class="block text-[10px] text-slate-400 mb-1">رقم البطاقة:</label>
                <input type="text" id="card-number" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="رقم البطاقة...">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">تاريخ الانتهاء:</label>
                    <input type="text" id="card-expiry" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="MM/YY">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 mb-1">رمز الأمان (CVV):</label>
                    <input type="text" id="card-cvv" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono" placeholder="CVV">
                </div>
            </div>
        </div>

        <!-- زر الحفظ -->
        <button onclick="saveCard()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-xl transition text-xs">
            💾 حفظ البطاقة محلياً
        </button>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6LiWhZ82I1A94VuOlNsLN7Yz1QL7GRBLVBH60n7gUnkOA";
        
        let currentStep = 'front'; // البدء بوجه البطاقة
        let frontCardData = {};
        let videoStream = null;

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const instructionText = document.getElementById('instruction-text');
        const captureBtn = document.getElementById('capture-btn');

        // تشغيل الكاميرا تلقائياً عند فتح الصفحة
        async function initCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } // استخدام الكاميرا الخلفية إن توفرت
                });
                video.srcObject = videoStream;
            } catch (err) {
                console.error("خطأ في تشغيل الكاميرا: ", err);
                alert("تعذر الوصول إلى كاميرا الجهاز. يرجى التأكد من منح الصلاحيات.");
            }
        }

        initCamera();

        // التقاط الصورة الحالية من الفيديو وإرسالها لـ Gemini
        async function captureCardSide() {
            if (!videoStream) {
                alert('الكاميرا غير مفعلة!');
                return;
            }

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const base64Image = canvas.toDataURL('image/jpeg');
            document.getElementById('loading').classList.remove('hidden');

            try {
                let prompt = "";
                if (currentStep === 'front') {
                    prompt = "هذه صورة وجه بطاقة بنكية. استخرج منها رقم البطاقة (cardNumber) وتاريخ الانتهاء (expiryDate) بصيغة JSON فقط بالشكل التالي: {\"cardNumber\": \"...\", \"expiryDate\": \"...\"}. لا تضف أي نص آخر.";
                } else {
                    prompt = "هذه صورة ظهر بطاقة بنكية. استخرج منها رمز الأمان CVV أو CVC المكون من 3 أو 4 أرقام بصيغة JSON فقط بالشكل التالي: {\"cvv\": \"...\"}. لا تضف أي نص آخر.";
                }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: prompt },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image.split(',')[1]
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                document.getElementById('loading').classList.add('hidden');

                if (data.candidates && data.candidates[0].content) {
                    const rawText = data.candidates[0].content.parts[0].text;
                    const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                    const parsedData = JSON.parse(cleanJson);

                    if (currentStep === 'front') {
                        frontCardData = parsedData;
                        if (frontCardData.cardNumber) document.getElementById('card-number').value = frontCardData.cardNumber;
                        if (frontCardData.expiryDate) document.getElementById('card-expiry').value = frontCardData.expiryDate;

                        // التبديل للخطوة الثانية (الظهر)
                        currentStep = 'back';
                        instructionText.textContent = "الخطوة 2: ممتاز! يرجى [قلب البطاقة للظهر] لالتقاط رمز الأمان (CVV).";
                        instructionText.className = "text-xs text-purple-400 mt-1 font-semibold";
                        captureBtn.textContent = "📸 التقاط ظهر البطاقة (CVV)";
                        captureBtn.className = "flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm shadow-md";
                    } else {
                        if (parsedData.cvv) {
                            document.getElementById('card-cvv').value = parsedData.cvv;
                        }
                        instructionText.textContent = "تم استكمال مسح وجهي البطاقة بنجاح! يمكنك الحفظ الآن.";
                        instructionText.className = "text-xs text-emerald-400 mt-1 font-semibold";
                        captureBtn.textContent = "✅ اكتمل المسح";
                        captureBtn.disabled = true;
                        captureBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                } else {
                    alert('لم يتم التعرف على تفاصيل واضحة، حاول مرة أخرى.');
                }

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                console.error(error);
                alert('حدث خطأ أثناء معالجة الصورة.');
            }
        }

        function resetScanner() {
            currentStep = 'front';
            frontCardData = {};
            document.getElementById('card-number').value = '';
            document.getElementById('card-expiry').value = '';
            document.getElementById('card-cvv').value = '';
            instructionText.textContent = "الخطوة 1: يرجى توجيه الكاميرا نحو [وجه البطاقة الأمامي]";
            instructionText.className = "text-xs text-yellow-400 mt-1 font-semibold";
            captureBtn.textContent = "📸 التقاط وجه البطاقة";
            captureBtn.disabled = false;
            captureBtn.className = "flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl transition text-sm shadow-md";
        }

        function saveCard() {
            const number = document.getElementById('card-number').value;
            const expiry = document.getElementById('card-expiry').value;
            const cvv = document.getElementById('card-cvv').value;

            if (!number) {
                alert('لا توجد بيانات كافية لحفظها!');
                return;
            }

            const cardData = { number, expiry, cvv, date: new Date().toLocaleString() };
            let savedCards = JSON.parse(localStorage.getItem('saved_bank_cards') || '[]');
            savedCards.push(cardData);
            localStorage.setItem('saved_bank_cards', JSON.stringify(savedCards));

            alert('تم حفظ البطاقة بنجاح في متصفحك!');
        }
    </script>
</body>
</html>
